name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    name: Select release policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      artifact-suffix: ${{ steps.policy.outputs.artifact-suffix }}
    steps:
      - name: Select beta or production mode
        id: policy
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "mode=beta" >> "$GITHUB_OUTPUT"
            echo "artifact-suffix=-unsigned-beta" >> "$GITHUB_OUTPUT"
            echo "Unsigned beta release selected; signing credentials are optional and will not be used."
            exit 0
          fi

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag '$GITHUB_REF_NAME'. Use vX.Y.Z-beta.N for an unsigned beta or vX.Y.Z for signed production." >&2
            exit 1
          fi

          echo "mode=production" >> "$GITHUB_OUTPUT"
          echo "artifact-suffix=-signed-production" >> "$GITHUB_OUTPUT"

      - name: Validate production signing credentials
        if: steps.policy.outputs.mode == 'production'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          required=(
            WINDOWS_CERTIFICATE
            WINDOWS_CERTIFICATE_PASSWORD
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Signed production release %s cannot start. Configure these GitHub Actions secrets: %s\n' \
              "$GITHUB_REF_NAME" "${missing[*]}" >&2
            exit 1
          fi
          echo "Signed production release selected; all required signing credentials are configured."

  validate-tag:
    name: Validate release tag
    needs: release-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out triggering tag with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Require tagged commit to be contained in main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in origin/main." >&2
            exit 1
          fi

  package:
    name: Build release installers
    needs: [release-policy, validate-tag]
    uses: ./.github/workflows/desktop-build.yml
    with:
      expected-tag: ${{ github.ref_name }}
      retention-days: 30
      require-signing: ${{ needs.release-policy.outputs.mode == 'production' }}
      artifact-suffix: ${{ needs.release-policy.outputs.artifact-suffix }}
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [release-policy, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify required release assets
        shell: bash
        run: |
          shopt -s nullglob
          dmg=(release-assets/*.dmg)
          deb=(release-assets/*.deb)
          appimage=(release-assets/*.AppImage)
          windows=(release-assets/*.exe)
          msi=(release-assets/*.msi)
          (( ${#dmg[@]} > 0 )) || { echo "Missing required macOS disk image" >&2; exit 1; }
          (( ${#deb[@]} > 0 )) || { echo "Missing required Debian installer" >&2; exit 1; }
          (( ${#appimage[@]} > 0 )) || { echo "Missing required AppImage" >&2; exit 1; }
          (( ${#windows[@]} > 0 )) || { echo "Missing required Windows installer" >&2; exit 1; }
          (( ${#msi[@]} > 0 )) || { echo "Missing required Windows MSI installer" >&2; exit 1; }
          echo "Required assets: ${#dmg[@]} DMG, ${#deb[@]} Debian, ${#appimage[@]} AppImage, ${#windows[@]} EXE, ${#msi[@]} MSI"
      - name: Label unsigned beta installers
        if: needs.release-policy.outputs.mode == 'beta'
        shell: bash
        run: |
          shopt -s nullglob
          for asset in release-assets/*.{dmg,deb,AppImage,exe,msi}; do
            extension="${asset##*.}"
            mv -- "$asset" "${asset%.*}-unsigned-beta.${extension}"
          done
      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(
            "$GITHUB_REF_NAME"
            release-assets/*
            --draft
            --verify-tag
            --generate-notes
          )
          if [[ "${{ needs.release-policy.outputs.mode }}" == "beta" ]]; then
            args+=(
              --prerelease
              --title "Noto AI $GITHUB_REF_NAME (Unsigned Beta)"
              --notes "Unsigned beta build. Windows and macOS may display publisher or Gatekeeper warnings. Verify SHA256SUMS before installation."
            )
          else
            args+=(--title "Noto AI $GITHUB_REF_NAME")
          fi
          gh release create "${args[@]}"
