name: Native desktop build

on:
  workflow_call:
    inputs:
      expected-tag:
        description: Optional v-prefixed tag that must match all application manifests
        required: false
        type: string
        default: ""
      retention-days:
        description: Number of days to retain installer artifacts
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: noto-ai-linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: noto-ai-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            wget \
            patchelf

      - name: Reject tracked local environment files
        shell: bash
        run: |
          if git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '(^|/)\.env\.example$' \
            >/dev/null; then
            echo "A prohibited local environment file is tracked; only .env.example is allowed." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate release versions
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          if [[ -n "$EXPECTED_TAG" ]]; then
            python scripts/check-version.py --tag "$EXPECTED_TAG"
          else
            python scripts/check-version.py
          fi

      - name: Prepare Linux sidecar environment
        if: runner.os == 'Linux'
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e './backend[dev,package]'

      - name: Prepare Windows sidecar environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv backend/.venv &&
            backend/.venv/Scripts/python.exe -m pip install --upgrade pip &&
            backend/.venv/Scripts/python.exe -m pip install -e './backend[dev,package]'

      - name: Run Linux Python checks
        if: runner.os == 'Linux'
        run: |
          backend/.venv/bin/python -m ruff check backend
          backend/.venv/bin/python -m ruff format --check backend
          backend/.venv/bin/python -m pytest backend

      - name: Run Windows Python checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          backend/.venv/Scripts/python.exe -m ruff check backend &&
            backend/.venv/Scripts/python.exe -m ruff format --check backend &&
            backend/.venv/Scripts/python.exe -m pytest backend

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Run Rust static checks
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build Linux sidecar
        if: runner.os == 'Linux'
        run: ./scripts/build-sidecar.sh "${{ matrix.target }}"

      - name: Verify Linux sidecar
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sidecar="frontend/src-tauri/binaries/noto-backend-${{ matrix.target }}"
          test -x "$sidecar"
          backend/.venv/bin/pyi-archive_viewer -r -l "$sidecar" | grep -F "'app.main'"
          backend/.venv/bin/pyi-archive_viewer -r -l "$sidecar" | grep -F "'app.parent_monitor'"
          sha256sum "$sidecar"

      - name: Build Windows sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 "${{ matrix.target }}"

      - name: Verify Windows sidecar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sidecar = "frontend/src-tauri/binaries/noto-backend-${{ matrix.target }}.exe"
          if (-not (Test-Path -PathType Leaf $sidecar)) {
            throw "Missing packaged sidecar: $sidecar"
          }
          $archive = & backend/.venv/Scripts/pyi-archive_viewer.exe -r -l $sidecar
          $archiveText = $archive -join "`n"
          if ($archiveText -notmatch "'app\.main'") {
            throw "The packaged sidecar is missing the required app.main module."
          }
          if ($archiveText -notmatch "'app\.parent_monitor'") {
            throw "The packaged sidecar is missing the required app.parent_monitor module."
          }
          Get-FileHash -Algorithm SHA256 $sidecar

      - name: Run Rust tests with the native sidecar
        working-directory: frontend/src-tauri
        shell: bash
        run: cargo test --all-features --locked

      - name: Build required Linux Debian installer
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles deb

      - name: Build required Linux AppImage
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles appimage

      - name: Build Windows installers
        if: runner.os == 'Windows'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles nsis,msi

      - name: Verify Linux installer outputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb' >/dev/null
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage' >/dev/null

      - name: Verify Windows installer outputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi')) {
            throw 'Missing MSI installer.'
          }
          if (-not (Get-ChildItem 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe')) {
            throw 'Missing NSIS installer.'
          }

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
