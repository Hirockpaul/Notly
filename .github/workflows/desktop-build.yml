name: Native desktop build

on:
  workflow_call:
    inputs:
      expected-tag:
        description: Optional v-prefixed tag that must match all application manifests
        required: false
        type: string
        default: ""
      retention-days:
        description: Number of days to retain installer artifacts
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: noto-ai-linux-x86_64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: noto-ai-macos-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            wget \
            patchelf

      - name: Reject tracked local environment files
        shell: bash
        run: |
          if git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '(^|/)\.env\.example$' \
            >/dev/null; then
            echo "A prohibited local environment file is tracked; only .env.example is allowed." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run format:check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate release versions
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          if [[ -n "$EXPECTED_TAG" ]]; then
            python scripts/check-version.py --tag "$EXPECTED_TAG"
          else
            python scripts/check-version.py
          fi

      - name: Prepare native sidecar environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e './backend[dev,package]'

      - name: Run Python checks
        run: |
          backend/.venv/bin/python -m ruff check backend
          backend/.venv/bin/python -m ruff format --check backend
          backend/.venv/bin/python -m pytest backend

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Run Rust static checks
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build native sidecar
        run: ./scripts/build-sidecar.sh "${{ matrix.target }}"

      - name: Verify native sidecar
        shell: bash
        run: |
          sidecar="frontend/src-tauri/binaries/noto-backend-${{ matrix.target }}"
          test -x "$sidecar"
          backend/.venv/bin/pyi-archive_viewer -r -l "$sidecar" | grep -F "'app.main'"
          backend/.venv/bin/pyi-archive_viewer -r -l "$sidecar" | grep -F "'app.parent_monitor'"
          backend/.venv/bin/python -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$sidecar"

      - name: Run Rust tests with the native sidecar
        working-directory: frontend/src-tauri
        shell: bash
        run: cargo test --all-features --locked

      - name: Build required Linux Debian installer
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles deb

      - name: Build required Linux AppImage
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles appimage

      - name: Build required macOS disk image
        if: runner.os == 'macOS'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles dmg

      - name: Verify Linux installer outputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb' >/dev/null
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage' >/dev/null

      - name: Verify macOS installer output
        if: runner.os == 'macOS'
        shell: bash
        run: |
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg' >/dev/null

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
