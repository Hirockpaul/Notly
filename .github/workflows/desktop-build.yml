name: Native desktop build

on:
  workflow_call:
    inputs:
      expected-tag:
        description: Optional v-prefixed tag that must match all application manifests
        required: false
        type: string
        default: ""
      retention-days:
        description: Number of days to retain installer artifacts
        required: false
        type: number
        default: 14
      require-signing:
        description: Require Windows signing plus macOS Developer ID signing and notarization
        required: false
        type: boolean
        default: false
      artifact-suffix:
        description: Suffix appended to uploaded workflow artifact names
        required: false
        type: string
        default: ""
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: noto-ai-linux-x86_64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            artifact: noto-ai-macos-aarch64
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: noto-ai-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            wget \
            patchelf

      - name: Reject tracked local environment files
        shell: bash
        run: |
          if git ls-files \
            | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '(^|/)\.env\.example$' \
            >/dev/null; then
            echo "A prohibited local environment file is tracked; only .env.example is allowed." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check frontend formatting
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run format:check

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Validate release versions
        shell: bash
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          if [[ -n "$EXPECTED_TAG" ]]; then
            python scripts/check-version.py --tag "$EXPECTED_TAG"
          else
            python scripts/check-version.py
          fi

      - name: Prepare native sidecar environment
        if: runner.os != 'Windows'
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -e './backend[dev,package]'

      - name: Prepare native sidecar environment on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -e './backend[dev,package]'

      - name: Run Python checks
        if: runner.os != 'Windows'
        run: |
          backend/.venv/bin/python -m ruff check backend
          backend/.venv/bin/python -m ruff format --check backend
          backend/.venv/bin/python -m pytest backend

      - name: Run Python checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          backend/.venv/Scripts/python.exe -m ruff check backend
          backend/.venv/Scripts/python.exe -m ruff format --check backend
          backend/.venv/Scripts/python.exe -m pytest backend

      - name: Build native sidecar
        if: runner.os != 'Windows'
        run: ./scripts/build-sidecar.sh "${{ matrix.target }}"

      - name: Build native sidecar on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 "${{ matrix.target }}"

      - name: Verify native sidecar
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sidecar="frontend/src-tauri/binaries/noto-backend-${{ matrix.target }}"
          test -x "$sidecar"
          backend/.venv/bin/pyi-archive_viewer -r -l "$sidecar" | grep -F "'app.main'"
          backend/.venv/bin/pyi-archive_viewer -r -l "$sidecar" | grep -F "'app.parent_monitor'"
          backend/.venv/bin/python -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$sidecar"

      - name: Verify native sidecar on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sidecar = "frontend/src-tauri/binaries/noto-backend-${{ matrix.target }}.exe"
          if (-not (Test-Path $sidecar)) { throw "Missing Windows sidecar: $sidecar" }
          backend/.venv/Scripts/pyi-archive_viewer.exe -r -l $sidecar | Select-String -SimpleMatch "'app.main'"
          backend/.venv/Scripts/pyi-archive_viewer.exe -r -l $sidecar | Select-String -SimpleMatch "'app.parent_monitor'"
          Get-FileHash -Algorithm SHA256 $sidecar

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Require release signing credentials
        id: signing
        if: inputs.require-signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            [[ -n "$WINDOWS_CERTIFICATE" ]] || missing+=(WINDOWS_CERTIFICATE)
            [[ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]] || missing+=(WINDOWS_CERTIFICATE_PASSWORD)
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            [[ -n "$APPLE_CERTIFICATE" ]] || missing+=(APPLE_CERTIFICATE)
            [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=(APPLE_CERTIFICATE_PASSWORD)
            [[ -n "$KEYCHAIN_PASSWORD" ]] || missing+=(KEYCHAIN_PASSWORD)
            [[ -n "$APPLE_SIGNING_IDENTITY" ]] || missing+=(APPLE_SIGNING_IDENTITY)
            [[ -n "$APPLE_ID" ]] || missing+=(APPLE_ID)
            [[ -n "$APPLE_PASSWORD" ]] || missing+=(APPLE_PASSWORD)
            [[ -n "$APPLE_TEAM_ID" ]] || missing+=(APPLE_TEAM_ID)
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Production signing is required, but these GitHub Actions secrets are missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "noto-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } }
          $config | ConvertTo-Json -Depth 4 | Set-Content frontend/src-tauri/tauri.release.conf.json

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/noto-signing.p12"
          keychain_path="$RUNNER_TEMP/noto-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Run Rust static checks
        working-directory: frontend/src-tauri
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run Rust tests with the native sidecar
        working-directory: frontend/src-tauri
        shell: bash
        run: cargo test --all-features --locked

      - name: Build required Linux Debian installer
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles deb

      - name: Build required Linux AppImage
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles appimage

      - name: Build required unsigned macOS disk image
        if: runner.os == 'macOS' && !inputs.require-signing
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles dmg --no-sign

      - name: Build required signed and notarized macOS disk image
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        working-directory: frontend
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles dmg

      - name: Build required unsigned Windows installer
        if: runner.os == 'Windows' && !inputs.require-signing
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles nsis,msi --no-sign

      - name: Build required signed Windows installer
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        working-directory: frontend
        run: npm run tauri:build -- --target "${{ matrix.target }}" --bundles nsis,msi --config src-tauri/tauri.release.conf.json

      - name: Verify Linux installer outputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb' >/dev/null
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage' >/dev/null

      - name: Verify AppImage media framework
        if: runner.os == 'Linux'
        shell: bash
        run: |
          appimage=(frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          inspection_dir="$(mktemp -d)"
          trap 'rm -rf "$inspection_dir"' EXIT
          chmod +x "${appimage[0]}"
          (cd "$inspection_dir" && "$GITHUB_WORKSPACE/${appimage[0]}" --appimage-extract >/dev/null)
          test -f "$inspection_dir/squashfs-root/usr/lib/gstreamer-1.0/libgstapp.so"

      - name: Verify macOS installer output
        if: runner.os == 'macOS'
        shell: bash
        run: |
          compgen -G 'frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg' >/dev/null

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && steps.signing.outputs.apple == 'true'
        shell: bash
        run: |
          app=(frontend/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          dmg=(frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "${app[0]}"
          spctl --assess --type execute --verbose=2 "${app[0]}"
          xcrun stapler validate "${dmg[0]}"

      - name: Verify Windows installer output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe")
          $packages = @(Get-ChildItem "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi")
          if ($executables.Count -eq 0) { throw "Missing required Windows NSIS installer" }
          if ($packages.Count -eq 0) { throw "Missing required Windows MSI installer" }

      - name: Verify Windows Authenticode signature
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'true'
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
            Get-ChildItem "frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi"
          )
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") { throw "Invalid signature on $($installer.Name): $($signature.Status)" }
          }

      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}${{ inputs.artifact-suffix }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}${{ inputs.artifact-suffix }}
          path: frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}${{ inputs.artifact-suffix }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
